<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Mike Hadfield</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- theme + background before first paint, so there's no flash of the wrong one -->
    <script>
        (function () {
            var d = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
            d.dataset.theme = g('mh-theme') || 'dark';
            d.dataset.bg = g('mh-bg') || 'grid';
            d.dataset.scan = g('mh-scan') || 'on';
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <div class="grid-bg"></div>
        <div class="scanlines"></div>
    </div>

    <!-- Admin: edits save only through the local admin server (tools/admin_server.py). On the
         public site there's no server behind it, so this page opens read-only. -->
    <main class="terminal" id="terminal" data-size="admin">
        <div class="terminal__bar">
            <div class="terminal__dots">
                <a class="dot dot--red dot--link" href="index.html" title="Back to the site" aria-label="Back to the site"></a>
                <span class="dot dot--yellow" aria-hidden="true"></span>
                <span class="dot dot--green" aria-hidden="true"></span>
            </div>
            <span class="terminal__path" id="terminal-path">mike@mikehadfield:~/admin</span>
            <div class="bar-right">
                <nav class="bar-nav" id="bar-nav" aria-label="Sections">
                    <a href="index.html#/cv">cv</a>
                    <a href="index.html#/projects">projects</a>
                    <a href="index.html">site</a>
                </nav>
                <button class="icon-btn" type="button" id="bg-btn" aria-haspopup="true" aria-expanded="false" aria-controls="bg-menu" aria-label="Background" title="Background">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
                </button>
                <button class="icon-btn theme-btn" type="button" id="theme-btn" aria-label="Switch to light theme">
                    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
            </div>
        </div>

        <div class="terminal__viewport" id="viewport">
            <div id="admin-root"><div class="terminal__body"><p class="tagline">loading<span class="cursor">_</span></p></div></div>
        </div>
    </main>

    <footer class="footer">
        <span>mikehadfield.co.uk</span>
        <span class="footer__sep" aria-hidden="true">·</span>
        <span>admin</span>
    </footer>

    <div class="tip" id="tip" role="tooltip" hidden></div>

    <!-- background picker (title-bar grid button) -->
    <div class="bg-menu" id="bg-menu" hidden>
        <p class="bg-menu__cmd"><span class="prompt">$</span>set background</p>
        <div class="bg-menu__opts" role="radiogroup" aria-label="Background">
            <button type="button" role="radio" data-bg="grid"><span class="swatch swatch--grid"></span>grid</button>
            <button type="button" role="radio" data-bg="dots"><span class="swatch swatch--dots"></span>dots</button>
            <button type="button" role="radio" data-bg="glow"><span class="swatch swatch--glow"></span>glow</button>
            <button type="button" role="radio" data-bg="plain"><span class="swatch swatch--plain"></span>plain</button>
        </div>
        <label class="bg-menu__scan"><input type="checkbox" id="scan-toggle"> scanlines</label>
    </div>

    <script src="shared.js" defer></script>
    <script src="admin.js" defer></script>
</body>
</html>
